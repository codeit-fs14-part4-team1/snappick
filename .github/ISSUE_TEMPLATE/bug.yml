name: 버그 이슈
description: 발견한 문제를 등록합니다
title: '[ID] '
labels:
  - qa
body:
  - type: markdown
    attributes:
      value: |
        제목의 `[ID]`를 체크 줄 ID로 바꿔 주세요. 예: `[FEED-L2-14] 인기순 스크롤 중 사진 누락`
        ID는 하나만 씁니다.

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 최초 판단은 잠정이고 트리아지(확정회의)에서 확정합니다.
      options:
        - 1 · 흐름이 막히거나 데이터·권한 문제
        - 2 · 잘못 동작하거나 정책과 다르지만 우회 가능
        - 3 · 화면·문구 문제
    validations:
      required: true

  - type: dropdown
    id: viewport
    attributes:
      label: 해상도
      multiple: true
      options:
        - PC (1920)
        - Tablet (768)
        - Mobile (375)
        - 실제 휴대폰
        - 해당 없음 (BE·AC)
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: 계정
      multiple: true
      options:
        - 비회원
        - 일반
        - 작가
    validations:
      required: true

  - type: input
    id: occurred-at
    attributes:
      label: 발생 시각 (KST)
      description: QA 도중 수정 배포가 있을 수 있고 같은 staging 데이터를 함께 쓰므로, 문제가 생긴 시각을 적어 주세요.
      placeholder: 2026-11-26 14:30
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇을 했을 때, 무엇이 보였는지 적어 주세요. 스크린샷이나 콘솔 로그를 붙여도 됩니다.
      placeholder: |
        1. 인기순으로 바꾸고 3페이지까지 스크롤
        2. 같은 사진이 두 번 보임
    validations:
      required: true
